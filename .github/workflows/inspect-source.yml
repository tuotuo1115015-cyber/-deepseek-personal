name: Inspect and Build DeepSeek Personal

on:
  push:
    branches: [main]
    paths:
      - "deepseek-personal-v0.2.0-source.zip"
      - ".github/workflows/inspect-source.yml"
      - "patches/model-selector-position.patch"
      - "patches/history-picker.patch"
      - "overlays/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          set -euo pipefail
          test -f deepseek-personal-v0.2.0-source.zip
          mkdir -p extracted
          unzip -q deepseek-personal-v0.2.0-source.zip -d extracted
          find extracted -maxdepth 4 -type f | sort | sed -n '1,200p'

      - name: Apply model selector placement patch
        run: |
          set -euo pipefail
          cd extracted/deepseek-personal-v0.2.0
          git apply ../../patches/model-selector-position.patch
          grep -n -A24 'className={styles.right}' src/components/chatInput/ChatInput.tsx

      - name: Apply history picker patch and source overlays
        run: |
          set -euo pipefail
          cd extracted/deepseek-personal-v0.2.0
          git apply --recount ../../patches/history-picker.patch
          cp -R ../../overlays/. .
          test -f src/services/chat/history/mergeArchive.ts
          test -f src/components/settings/HistoryPickerDialog.tsx

      - name: Package source files for implementation review
        working-directory: extracted/deepseek-personal-v0.2.0
        run: |
          set -euo pipefail
          mkdir -p ../../source-review
          cp src/services/chat/backup.ts ../../source-review/
          cp src/services/chat/history/README.md ../../source-review/
          cp src/services/chat/history/{zipReader.ts,zipWriter.ts,format.ts,schema.ts,paths.ts,importArchive.ts,exportArchive.ts} ../../source-review/
          cp src/components/settings/SettingsDialog.tsx ../../source-review/
          cp src/components/settings/Settings.module.css ../../source-review/
          cp src/components/base/{Modal.tsx,Modal.module.css,Button.tsx,Button.module.css,Select.tsx,Select.module.css} ../../source-review/
          cp src/components/settings/settingsDialogState.ts ../../source-review/
          cp src/i18n/index.ts ../../source-review/
          cp src/services/chat/history/errors.ts ../../source-review/
          cp src/services/chat/history/toArchive.ts ../../source-review/
          cp src/i18n/{zh.ts,en.ts} ../../source-review/
          cd ../..
          zip -qr source-review.zip source-review

      - name: Upload source review
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-personal-source-review
          path: source-review.zip
          if-no-files-found: error
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: extracted/deepseek-personal-v0.2.0/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: extracted/deepseek-personal-v0.2.0
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: extracted/deepseek-personal-v0.2.0
        run: pnpm type

      - name: Lint check
        working-directory: extracted/deepseek-personal-v0.2.0
        run: pnpm lint

      - name: Production build
        working-directory: extracted/deepseek-personal-v0.2.0
        run: pnpm build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-personal-dist
          path: extracted/deepseek-personal-v0.2.0/dist/
          if-no-files-found: error
          retention-days: 7
